[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-viewer"
version = "0.1.0"
description = "Desktop viewer for Imaris microscopy images and saved cell annotations"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "pyvista>=0.46,<0.47",
  "pyvistaqt>=0.11,<0.12",
  "vtk>=9.3,!=9.4.0,<9.6",
  "numpy>=1.26,<3",
  "h5py>=3.11,<4",
  "tifffile>=2024.8",
  "imagecodecs>=2024.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
fish-viewer = "fish_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["fish_viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests using local FISH data", "gui: offscreen GUI and rendering tests"]
filterwarnings = ["ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:vtkmodules.util.numpy_support"]
